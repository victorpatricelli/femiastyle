<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FemiaStyle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#9b1c43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Great+Vibes&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra laterale su tablet/PC, barra in basso su telefono; contenuto a colonne che si impilano. */
:root {
  --bg: #f6f3f4;
  --surface: #ffffff;
  --surface-2: #efe8eb;
  --ink: #241b20;
  --muted: #6e6167;
  --line: #e3d9dd;
  --accent: #9b1c43;
  --accent-soft: #f6e4ea;
  --on-accent: #ffffff;
  --brass: #8f6a26;
  --ok: #2b7351;
  --ok-soft: #e1f0e7;
  --warn: #9a5a12;
  --warn-soft: #fbeedb;
  --danger: #b3261e;
  --danger-soft: #fbe3e1;
  --shadow: 0 1px 2px rgba(36, 27, 32, .06), 0 8px 24px rgba(36, 27, 32, .06);
  --f-display: 'Bodoni Moda', 'Bodoni 72', Didot, Georgia, serif;
  --f-script: 'Great Vibes', 'Snell Roundhand', 'Apple Chancery', 'Brush Script MT', cursive;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 12px;
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151013; --surface: #1f181c; --surface-2: #2a2126; --ink: #f3ecef; --muted: #a9999f; --line: #382d33;
    --accent: #e7708f; --accent-soft: #3b1f29; --on-accent: #1b0d12; --brass: #d4ad66;
    --ok: #6cc596; --ok-soft: #173326; --warn: #e9a95e; --warn-soft: #3a2815; --danger: #f08b82; --danger-soft: #3c1b19;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151013; --surface: #1f181c; --surface-2: #2a2126; --ink: #f3ecef; --muted: #a9999f; --line: #382d33;
  --accent: #e7708f; --accent-soft: #3b1f29; --on-accent: #1b0d12; --brass: #d4ad66;
  --ok: #6cc596; --ok-soft: #173326; --warn: #e9a95e; --warn-soft: #3a2815; --danger: #f08b82; --danger-soft: #3c1b19;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }

/* ---------- Struttura ---------- */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; background: linear-gradient(to right, var(--surface) 227px, var(--line) 227px, var(--line) 228px, transparent 228px); }
.side {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px;
  padding: 22px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-script); font-size: 34px; font-weight: 400; line-height: 1; color: var(--accent); }
.mbrand { display: none; font-family: var(--f-script); font-size: 32px; line-height: 1; color: var(--accent); margin-bottom: 12px; }
@media (max-width: 860px) { .mbrand { display: block; } }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: -2px; }
.navbtn {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
  background: none; cursor: pointer; text-align: left; font-weight: 500; color: var(--muted);
}
.navbtn svg { width: 20px; height: 20px; flex: none; }
.navbtn:hover { background: var(--surface-2); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navbtn.cassa { margin: 6px 0; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.navbtn.cassa:hover { filter: brightness(1.06); background: var(--accent); color: var(--on-accent); }
.side .spacer { flex: 1; }

main {
  min-width: 0; width: 100%; max-width: 1180px; margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
}
.tabbar { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); background: none; }
  .side { display: none; }
  main {
    padding-block: 18px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    min-height: var(--tab-h); background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .tabbar button {
    border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; font-weight: 500; color: var(--muted); cursor: pointer; padding: 6px 0;
  }
  .tabbar svg { width: 22px; height: 22px; }
  .tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .tabbar .cassa span.dot {
    width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center; margin-top: -18px; box-shadow: var(--shadow);
  }
}

/* ---------- Elementi ---------- */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.pagehead h1 { font-family: var(--f-display); font-size: clamp(28px, 4vw, 40px); line-height: 1.05; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.strong { font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600;
  text-decoration: none; color: var(--ink); white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.wa { color: var(--ok); border-color: var(--ok-soft); }
.btn.wa:hover { background: var(--ok-soft); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 40px; padding: 0; }
.btn.sm.icon { width: 32px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.panel > header h2 { font-size: 16px; }
.panel .body { padding: 12px 16px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 1000px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.kpi .v { font-family: var(--f-display); font-size: 28px; line-height: 1.15; margin-top: 4px; font-variant-numeric: lining-nums tabular-nums; }
.kpi .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.kpi.accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.kpi.accent .l, .kpi.accent .s { color: var(--on-accent); opacity: .85; }

.list { list-style: none; margin: 0; padding: 0; }
.list > li { border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 0; background: none; border: 0; text-align: left; cursor: pointer;
}
.panel .list .item { padding-inline: 0; }
.item:hover .t { color: var(--accent); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .d { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .main { flex: 1; min-width: 0; }
.item .end { text-align: right; flex: none; }
.empty { padding: 18px 0 6px; color: var(--muted); font-size: 14px; }

.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--surface-2); color: var(--ink); letter-spacing: .02em;
}
.avatar.lg { width: 56px; height: 56px; font-size: 18px; font-family: var(--f-display); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.opdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input[type] { padding-left: 38px; }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type=text], input[type=tel], input[type=email], input[type=number], input[type=date], input[type=url], input[type=password], input[type=search], select, textarea {
  width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 400; font-size: 15px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink); font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); margin: 1px 0 0; flex: none; }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .form { grid-template-columns: minmax(0, 1fr); } }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); margin-bottom: 18px; font-size: 14px; }
.banner b { color: inherit; }
.banner .btn { margin-left: auto; }

.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); padding: 8px 10px; border-radius: 10px; border: 0; background: none; cursor: pointer; text-align: left; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.ok i { background: var(--ok); }
.sync.wait i { background: var(--warn); }
.sync.err i { background: var(--danger); }
.sync.demo i { background: var(--brass); }
.topsync { display: none; }
@media (max-width: 860px) { .topsync { display: inline-flex; } }

/* Tabelle */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }

/* Barre */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 180px; padding-top: 22px; }
.bars .b { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.bars .col { width: 100%; max-width: 46px; background: var(--accent-soft); border-radius: 6px 6px 2px 2px; position: relative; min-height: 2px; }
.bars .b.cur .col { background: var(--accent); }
.bars .col span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); padding-bottom: 3px; white-space: nowrap; }
.bars .lab { font-size: 11px; color: var(--muted); text-transform: capitalize; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.hbar .track { height: 8px; background: var(--surface-2); border-radius: 99px; margin-top: 5px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--accent); border-radius: 99px; }
.hbar.brass .fill { background: var(--brass); }

/* Cassa */
.cassa { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; align-items: start; }
@media (max-width: 1080px) { .cassa { grid-template-columns: minmax(0, 1fr) 340px; } }
@media (max-width: 860px) { .cassa { grid-template-columns: minmax(0, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: 10px; min-height: 74px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; position: relative;
}
.tile:hover { border-color: var(--accent); }
.tile:active { transform: scale(.98); }
.tile .n { font-weight: 600; line-height: 1.25; }
.tile .p { color: var(--muted); font-size: 13px; margin-top: auto; }
.tile .q { margin-top: 6px; }
.tile.low { border-style: dashed; }
.receipt { position: sticky; top: 16px; }
.receipt .body { display: flex; flex-direction: column; gap: 14px; }
.rline { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.rline:first-child { border-top: 0; }
.rline .nm { font-weight: 600; font-size: 14px; }
.rline .sub { font-size: 12px; color: var(--muted); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
.qty button { width: 28px; height: 28px; border: 0; background: none; cursor: pointer; font-size: 16px; color: var(--muted); }
.qty span { min-width: 22px; text-align: center; font-size: 14px; font-weight: 600; }
.price-in { width: 84px !important; min-height: 32px !important; padding: 4px 8px !important; text-align: right; font-size: 14px !important; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 2px solid var(--ink); }
.total .v { font-family: var(--f-display); font-size: 34px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 9px 4px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mobile-total { display: none; }
@media (max-width: 860px) {
  .receipt { position: static; }
  .mobile-total {
    display: flex; align-items: center; gap: 12px; position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); z-index: 15;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .mobile-total .v { font-family: var(--f-display); font-size: 24px; }
  main.has-total { padding-bottom: calc(var(--tab-h) + 96px + env(safe-area-inset-bottom, 0px)); }
}

/* Scheda cliente */
.profile { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.profile h1 { font-family: var(--f-display); font-size: clamp(26px, 4vw, 36px); }
.formula { padding: 12px 0; border-top: 1px solid var(--line); }
.formula:first-child { border-top: 0; padding-top: 2px; }
.formula .txt { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 6px; overflow-wrap: anywhere; }
.visit { padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.visit:first-child { border-top: 0; }
.visit:hover .strong { color: var(--accent); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }

/* Finestre */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(20, 12, 16, .45); }
.dialog {
  width: min(560px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  padding: 20px; display: flex; flex-direction: column; gap: 16px;
}
.dialog.wide { width: min(720px, 100%); }
.dialog h2 { font-family: var(--f-display); font-size: 24px; }
.dialog .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.dialog .actions .left { margin-right: auto; }
@media (max-width: 560px) {
  .modal { place-items: end stretch; padding: 0; }
  .dialog { width: 100%; border-radius: 16px 16px 0 0; max-height: 92%; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}
.bigtotal { text-align: center; padding: 10px 0; }
.bigtotal .v { font-family: var(--f-display); font-size: 56px; line-height: 1; color: var(--accent); font-variant-numeric: lining-nums tabular-nums; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}
@media (max-width: 860px) { #toast { bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px)); } body.in-cassa #toast { bottom: calc(var(--tab-h) + 88px + env(safe-area-inset-bottom, 0px)); } }

  for (const r of data.Righe) { if (!righe.has(r.venditaId)) righe.set(r.venditaId, []); righe.get(r.venditaId).push(r); }
  const vend = [...data.Vendite].sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0));
  const vendC = new Map();
  for (const v of vend) { if (!v.clienteId) continue; if (!vendC.has(v.clienteId)) vendC.set(v.clienteId, []); vendC.get(v.clienteId).push(v); }
  const stats = new Map();
  for (const c of data.Clienti) {
    const l = vendC.get(c.id) || [];
    const tot = l.reduce((s, v) => s + num(v.totale), 0);
    const last = l[0]?.data || '';
    const first = l[l.length - 1]?.data || '';
    let freq = null;
    if (l.length > 1) freq = Math.round((parseD(last) - parseD(first)) / 864e5 / (l.length - 1));
    stats.set(c.id, { tot, n: l.length, last, first, freq, media: l.length ? tot / l.length : 0 });
  }
  const formule = new Map();
  for (const f of [...data.Formule].sort((a, b) => (a.data < b.data ? 1 : -1))) {
    if (!formule.has(f.clienteId)) formule.set(f.clienteId, []); formule.get(f.clienteId).push(f);
  }
  D = { v: ver, by, giac, righe, vend, vendC, stats, formule };
  return D;
}

/* ---------- Scrittura e sincronizzazione ---------- */
function normRow(sheet, r) {
  const o = {};
  for (const c of SCHEMA[sheet]) {
    let v = r[c];
    if (NUM.includes(c)) v = num(v);
    else if (BOOL.includes(c)) v = bool(v);
    else v = v == null ? '' : String(v);
    o[c] = v;
  }
  if ((sheet === 'Servizi' || sheet === 'Operatori') && !['uomo', 'donna', 'tutti'].includes(o.reparto)) o.reparto = 'tutti';
  if (sheet === 'Appuntamenti') { o.data = o.data.slice(0, 10); o.ora = o.ora.slice(0, 5); if (!o.stato) o.stato = 'prenotato'; }
  return o;
}
function applyOp(d, op) {
  const arr = d[op.sheet];
  if (!arr) return;
  if (op.op === 'upsert') {
    const i = arr.findIndex(r => r.id === op.row.id);
    if (i >= 0) arr[i] = op.row; else arr.push(op.row);
  } else if (op.op === 'delete') {
    d[op.sheet] = arr.filter(r => r.id !== op.id);
  } else if (op.op === 'deleteWhere') {
    d[op.sheet] = arr.filter(r => String(r[op.field]) !== String(op.value));
  }
}
const up = (sheet, row) => ({ op: 'upsert', sheet, row: normRow(sheet, row) });
const del = (sheet, id) => ({ op: 'delete', sheet, id });
const delWhere = (sheet, field, value) => ({ op: 'deleteWhere', sheet, field, value });

function commit(ops, { quiet } = {}) {
  ops.forEach(o => applyOp(data, o));

  store.set(K.data, data);
  if (!isDemo()) { queue.push(...ops); store.set(K.queue, queue); scheduleSync(800); }
  if (!quiet) render();
  updateSync();
}

async function api(action, payload = {}) {
  const res = await fetch(cfg.apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ pin: cfg.pin, action }, payload)),
  });
  let j;
  try { j = await res.json(); } catch (e) { throw Object.assign(new Error('Risposta non valida dal Foglio. Controlla l\'indirizzo.'), { code: 'BAD' }); }
  if (!j.ok) throw Object.assign(new Error(j.error || 'Errore'), { code: j.code });
  return j;
}

let syncTimer = null;
function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }

async function sync({ loud } = {}) {
  if (isDemo() || syncing || needLogin) return;
  syncing = true; syncState = 'sync'; updateSync();
  try {
    while (queue.length) {
      const batch = queue.slice(0, 40);
      await api('batch', { ops: batch });
      queue.splice(0, batch.length);
      store.set(K.queue, queue);
    }
    const j = await api('bootstrap');
    const fresh = emptyData();
    for (const k in SCHEMA) fresh[k] = (j.data[k] || []).map(r => normRow(k, r));
    queue.forEach(o => applyOp(fresh, o)); // modifiche fatte durante il download
    data = fresh; ver++;
    store.set(K.data, data);
    meta.lastSync = Date.now(); store.set(K.meta, meta);
    syncState = 'ok';
    if (loud) toast('Dati aggiornati');
    if (!isBusy()) render();
  } catch (e) {
    if (e.code === 'PIN' || e.code === 'LOCK') { needLogin = true; syncState = 'err'; render(); toast(e.message); }
    else { syncState = navigator.onLine === false ? 'offline' : 'err'; if (loud) toast(e.message === 'Failed to fetch' ? 'Il Foglio non risponde. Le modifiche restano salvate qui.' : e.message); }
  } finally {
    syncing = false; updateSync();
  }
}
function isBusy() {
  const a = document.activeElement;
  return !$('#modal').hidden || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName));
}

function updateSync() {
  let cls = 'ok', txt;
  if (isDemo()) { cls = 'demo'; txt = 'Modalità prova'; }
  else if (syncState === 'sync') { cls = 'wait'; txt = 'Sincronizzo…'; }
  else if (queue.length) { cls = 'wait'; txt = `${queue.length} modific${queue.length === 1 ? 'a' : 'he'} da inviare`; }
  else if (syncState === 'offline') { cls = 'err'; txt = 'Senza connessione'; }
  else if (syncState === 'err') { cls = 'err'; txt = 'Foglio non raggiungibile'; }
  else txt = meta.lastSync ? `Aggiornato alle ${new Date(meta.lastSync).toTimeString().slice(0, 5)}` : 'Collegato';
  document.querySelectorAll('.sync').forEach(el => { el.className = 'sync ' + cls + (el.classList.contains('topsync') ? ' topsync' : ''); el.querySelector('span').textContent = txt; });
}

const icon = (n, s = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${s}>${I[n]}</svg>`;

/* ---------- Navigazione ---------- */
const NAV = [

];
function section() { return route.v === 'cliente' ? 'clienti' : route.v; }
function renderNav() {
  const cur = section();
  $('#sidenav').innerHTML = NAV.map(([k, l]) =>
    `<button type="button" class="navbtn ${k === 'cassa' ? 'cassa' : ''}" data-act="go" data-v="${k}" ${cur === k ? 'aria-current="page"' : ''}>${icon(k === 'cassa' ? 'plus' : k)}<span>${l}</span></button>`).join('');
  const tabs = [['agenda', 'Agenda'], ['oggi', 'Oggi'], ['cassa', 'Vendita'], ['clienti', 'Clienti'], ['altro', 'Altro']];
  const inAltro = ['magazzino', 'listino', 'statistiche', 'impostazioni'].includes(cur);
  $('#tabbar').innerHTML = tabs.map(([k, l]) => {
    const on = cur === k || (k === 'altro' && inAltro);
    if (k === 'cassa') return `<button type="button" class="cassa" data-act="go" data-v="cassa" ${on ? 'aria-current="page"' : ''}><span class="dot">${icon('plus')}</span>${l}</button>`;
    return `<button type="button" data-act="${k === 'altro' ? 'altro' : 'go'}" data-v="${k}" ${on ? 'aria-current="page"' : ''}>${icon(k)}${l}</button>`;

}
function go(v, params = {}) {

}

function render() {
  renderNav();

function demoBanner() {

function head(title, eyebrow = '', actions = '') {

}

/* ---------- Vista: Oggi ---------- */
function viewOggi() {
  const d = derive();
  const t = todayStr();
  const now = new Date();
  const oggi = d.vend.filter(v => v.data.startsWith(t));
  const incOggi = oggi.reduce((s, v) => s + num(v.totale), 0);
  const ym = t.slice(0, 7);
  const mese = d.vend.filter(v => v.data.startsWith(ym));
  const incMese = mese.reduce((s, v) => s + num(v.totale), 0);
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const pym = `${prev.getFullYear()}-${pad(prev.getMonth() + 1)}`;
  const sameDayPrev = `${pym}-${pad(Math.min(now.getDate(), 28))}`;
  const incPrev = d.vend.filter(v => v.data.startsWith(pym) && v.data.slice(0, 10) <= sameDayPrev).reduce((s, v) => s + num(v.totale), 0);
  const delta = incPrev > 0 ? Math.round((incMese / incPrev - 1) * 100) : null;
  const low = data.Prodotti.filter(prodLow);
  const persi = clientiPersi().slice(0, 6);
  const comp = compleanni(7);
  const dataLunga = now.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

  return head(dataLunga.charAt(0).toUpperCase() + dataLunga.slice(1), h(cfg.salone), `<button class="btn primary" type="button" data-act="go" data-v="cassa">${icon('plus')}Nuova vendita</button>`) + chiusuraBanner() + `
  <div class="kpis">
    <div class="kpi accent"><div class="l">Incasso di oggi</div><div class="v">${eur(incOggi)}</div><div class="s">${oggi.length} scontrin${oggi.length === 1 ? 'o' : 'i'}</div></div>
    <div class="kpi"><div class="l">Mese in corso</div><div class="v">${eur(incMese)}</div><div class="s">${delta == null ? `${mese.length} scontrini` : `${delta >= 0 ? '+' : ''}${delta}% sullo stesso periodo del mese scorso`}</div></div>
    <div class="kpi"><div class="l">Da riordinare</div><div class="v">${low.length}</div><div class="s">prodott${low.length === 1 ? 'o' : 'i'} sotto la scorta minima</div></div>
  </div>
  <div class="grid2">
    <div class="stack">
      <section class="panel"><header><h2>Appuntamenti di oggi</h2><button class="btn sm ghost" type="button" data-act="agendaOggi">Agenda</button></header><div class="body">
        ${apptsOf(t).length ? `<ul class="list">${apptsOf(t).map(a => apptItem(a)).join('')}</ul>` : `<div class="empty">Nessun appuntamento oggi.</div>`}
      </div></section>
      <section class="panel"><header><h2>Vendite di oggi</h2><span class="muted small num">${eur(incOggi)}</span></header><div class="body">
        ${oggi.length ? `<ul class="list">${oggi.map(venditaItem).join('')}</ul>` : `<div class="empty">Nessuna vendita oggi. Le vendite che registri compaiono qui, con l'importo da battere sul registratore.</div>`}
      </div></section>
      <section class="panel"><header><h2>Da riordinare</h2><button class="btn sm ghost" type="button" data-act="go" data-v="magazzino">Magazzino</button></header><div class="body">
        ${low.length ? `<ul class="list">${low.map(p => `<li><button class="item" type="button" data-act="carico" data-id="${p.id}"><div class="main"><div class="t">${h(p.nome)}</div><div class="d">${h(p.marca)} · scorta minima ${fmtGiac(p, num(p.soglia))}</div></div><div class="end"><span class="pill ${giacenza(p.id) <= 0 ? 'danger' : 'warn'}">${fmtGiac(p)}</span></div></button></li>`).join('')}</ul>` : `<div class="empty">Tutto sopra la scorta minima.</div>`}
      </div></section>
    </div>
    <div class="stack">
      <section class="panel"><header><h2>Da richiamare</h2><span class="muted small">da più di ${cfg.giorniPersi} giorni · con consenso</span></header><div class="body">
        ${persi.length ? `<ul class="list">${persi.map(({ c, s }) => clienteItem(c, `<div class="end"><div class="num small strong">${eur(s.tot)}</div><div class="d small muted">${ago(s.last)}</div></div>`)).join('')}</ul>` : `<div class="empty">Nessuna cliente abituale assente da troppo tempo.</div>`}
      </div></section>
      <section class="panel"><header><h2>Compleanni dei prossimi 7 giorni</h2><span class="muted small">con consenso</span></header><div class="body">
        ${comp.length ? `<ul class="list">${comp.map(({ c, giorni }) => clienteItem(c, `<div class="end"><span class="pill ${giorni === 0 ? 'accent' : ''}">${giorni === 0 ? 'oggi' : giorni === 1 ? 'domani' : fdateShort(nextBirthday(c.compleanno))}</span></div>`)).join('')}</ul>` : `<div class="empty">Nessun compleanno in arrivo.</div>`}
      </div></section>
    </div>
  </div>`;
}
function venditaItem(v) {
  const d = derive();
  const c = d.by.Clienti.get(v.clienteId);
  const r = d.righe.get(v.id) || [];
  const desc = r.filter(x => x.tipo !== 'consumo').map(x => x.descrizione).join(', ') || 'Vendita';
  return `<li><button class="item" type="button" data-act="vendita" data-id="${v.id}">
    <span class="num muted small" style="width:42px">${ftime(v.data)}</span>
    <div class="main"><div class="t">${h(fullName(c))}</div><div class="d"><span class="opdot" style="background:${h(opColor(v.operatoreId))}"></span> ${h(opName(v.operatoreId))} · ${h(desc)}</div></div>
    <div class="end num strong">${eur(v.totale)}</div></button></li>`;
}
function clienteItem(c, end = '') {
  return `<li><button class="item" type="button" data-act="cliente" data-id="${c.id}"><span class="avatar">${h(initials(c))}</span><div class="main"><div class="t">${h(fullName(c))}</div><div class="d">${h(c.telefono || 'nessun telefono')}</div></div>${end}</button></li>`;
}
/* consenso ai messaggi promozionali (richiamo, auguri, offerte) */
const promoOk = c => bool(c?.consenso);
function clientiPersi() {
  const d = derive();
  return data.Clienti.filter(promoOk).map(c => ({ c, s: d.stats.get(c.id) }))
    .filter(({ s }) => s && s.n >= 2 && daysAgo(s.last) > num(cfg.giorniPersi))
    .sort((a, b) => b.s.tot - a.s.tot);
}
function nextBirthday(s) {
  const d = parseD(s);
  if (!d) return '';
  const now = sod(new Date());
  let n = new Date(now.getFullYear(), d.getMonth(), d.getDate());
  if (n < now) n = new Date(now.getFullYear() + 1, d.getMonth(), d.getDate());
  return localISO(n).slice(0, 10);
}
function compleanni(giorni) {
  return data.Clienti.filter(c => c.compleanno && promoOk(c)).map(c => ({ c, giorni: -daysAgo(nextBirthday(c.compleanno)) }))
    .filter(x => x.giorni >= 0 && x.giorni <= giorni).sort((a, b) => a.giorni - b.giorni);
}

      <div class="chips" role="group" aria-label="Ordina">${[['nome', 'A–Z'], ['ultima', 'Ultima visita'], ['spesa', 'Spesa']].map(([k, l]) => `<button class="chip" type="button" data-act="sortClienti" data-v="${k}" aria-pressed="${ui.clientiSort === k}">${l}</button>`).join('')}</div>
    </div>

}
function clientiList() {
  const d = derive();
  const q = ui.clientiQ.trim().toLowerCase();
  const qd = q.replace(/\D/g, '');
  let l = data.Clienti.filter(c => !q || fullName(c).toLowerCase().includes(q) || `${c.cognome} ${c.nome}`.toLowerCase().includes(q) || (qd.length >= 3 && String(c.telefono).replace(/\D/g, '').includes(qd)));
  const st = c => d.stats.get(c.id) || { tot: 0, n: 0, last: '' };
  if (ui.clientiSort === 'nome') l.sort((a, b) => fullName(a).localeCompare(fullName(b), 'it'));
  if (ui.clientiSort === 'ultima') l.sort((a, b) => (st(a).last < st(b).last ? 1 : -1));
  if (ui.clientiSort === 'spesa') l.sort((a, b) => st(b).tot - st(a).tot);
  if (!l.length) return `<div class="empty">${q ? 'Nessuna cliente trovata.' : 'Ancora nessuna cliente. Aggiungi la prima con “Nuova cliente”.'}</div>`;
  const more = l.length > 200;
  l = l.slice(0, 200);
  return `<ul class="list">${l.map(c => { const s = st(c); return clienteItem(c, `<div class="end"><div class="num small strong">${s.n ? eur(s.tot) : '—'}</div><div class="small muted">${s.n ? ago(s.last) : 'nessuna visita'}</div></div>`); }).join('')}</ul>${more ? `<div class="empty">Mostro le prime 200: affina la ricerca.</div>` : ''}`;
}

const unitOf = id => { const p = derive().by.Prodotti.get(id); return p ? ' ' + (p.unita || 'pz') : ''; };

/* ---------- Vista: Cassa ---------- */
let cart = newCart();
function newCart(clienteId = '') {
  return { clienteId, operatoreId: operatori().some(o => o.id === cfg.ultimoOperatore) ? cfg.ultimoOperatore : (operatori()[0]?.id || ''), righe: [], sconto: 0, metodo: 'carta', note: '', formula: '', tab: 'servizi', q: '', cq: '', apptId: '' };
}
const cartSub = () => cart.righe.reduce((s, r) => s + (r.tipo === 'consumo' ? 0 : num(r.qta) * num(r.prezzo)), 0);
const cartTot = () => Math.max(0, Math.round((cartSub() - num(cart.sconto)) * 100) / 100);

function viewCassa() {
  const d = derive();
  if (cart.clienteId && !d.by.Clienti.get(cart.clienteId)) cart.clienteId = '';
  return head('Nuova vendita', 'Cassa') + `

    <div class="stack">

        <div class="row" style="margin-bottom:12px">
          <div class="chips" role="tablist">${[['servizi', 'Servizi'], ['prodotti', 'Prodotti in vendita'], ['consumi', 'Tinte e consumi']].map(([k, l]) => `<button class="chip" type="button" role="tab" data-act="cassaTab" data-v="${k}" aria-pressed="${cart.tab === k}">${l}</button>`).join('')}</div>
        </div>
        <div class="search" style="margin-bottom:12px">${icon('search')}<input type="search" id="cassaQ" data-filter="cassaQ" placeholder="${cart.tab === 'servizi' ? 'Cerca un servizio' : 'Cerca o leggi il codice a barre'}" value="${h(cart.q)}" autocomplete="off"></div>

      </div></section>

  </div>
  <div class="mobile-total" id="mtot">${mobileTotal()}</div>`;
}
function catalogo() {
  const q = cart.q.trim().toLowerCase();
  if (cart.tab === 'servizi') {
    const l = data.Servizi.filter(s => bool(s.attivo) && (!q || s.nome.toLowerCase().includes(q)));
    if (!l.length) return `<div class="empty">${q ? 'Nessun servizio trovato.' : 'Nessun servizio nel listino. Aggiungili da Listino e staff.'}</div>`;
    const uv = !q && typeof ultimaVolta === 'function' ? ultimaVolta(cart.clienteId) : null;
    const tileS = s => `<button class="tile" type="button" data-act="addServizio" data-id="${s.id}"><span class="n">${h(s.nome)}</span><span class="p num">${prezzoTxt(s)}${num(s.durata) ? ` · ${num(s.durata)} min` : ''}</span></button>`;
    const last = uv ? `${lastBox(uv, 'cassaRipeti', 'Aggiungi tutto')}<div class="tiles" style="margin:10px 0 16px">${uv.ids.map(id => derive().by.Servizi.get(id)).filter(Boolean).map(tileS).join('')}</div>` : '';
    const groups = servGroups(l, cart.operatoreId);

function salvaVendita() {
  if (!cart.righe.length) return;
  const vid = uid(); const now = localISO(); const ops = [];
  const tot = cartTot();
  ops.push(up('Vendite', { id: vid, data: now, clienteId: cart.clienteId, operatoreId: cart.operatoreId, metodo: cart.metodo, sconto: num(cart.sconto), totale: tot, note: cart.note }));
  for (const r of cart.righe) {
    ops.push(up('Righe', { id: uid(), venditaId: vid, tipo: r.tipo, refId: r.refId, descrizione: r.descrizione, qta: r.qta, prezzo: r.tipo === 'consumo' ? 0 : r.prezzo, operatoreId: r.operatoreId || cart.operatoreId }));
    if (r.tipo !== 'servizio') ops.push(up('Movimenti', { id: uid(), data: now, prodottoId: r.refId, qta: -num(r.qta), causale: r.tipo === 'prodotto' ? 'vendita' : 'consumo', venditaId: vid }));
  }
  if (cart.clienteId && cart.formula.trim()) ops.push(up('Formule', { id: uid(), clienteId: cart.clienteId, data: todayStr(), operatoreId: cart.operatoreId, formula: cart.formula.trim(), note: '' }));
  const ap = cart.apptId && derive().by.Appuntamenti.get(cart.apptId);
  if (ap) ops.push(up('Appuntamenti', Object.assign({}, ap, { stato: 'fatto', venditaId: vid })));
  cfg.ultimoOperatore = cart.operatoreId; saveCfg();
  const metodo = METODI[cart.metodo];
  cart = newCart();
  commit(ops);
  openModal(`<div class="bigtotal"><div class="eyebrow">Da battere sul registratore</div><div class="v">${eur(tot)}</div><div class="muted" style="margin-top:8px">Pagamento: ${h(metodo)}</div></div>
    <p class="muted small" style="margin:0;text-align:center">La vendita è registrata nell'app. Lo scontrino fiscale si emette come sempre sul registratore telematico.</p>

}

/* ---------- Vista: Statistiche ---------- */
function periodRange(p) {
  const now = new Date();
  if (p === 'mese') return [new Date(now.getFullYear(), now.getMonth(), 1), 'questo mese'];
  if (p === '3m') return [new Date(now.getFullYear(), now.getMonth() - 2, 1), 'ultimi 3 mesi'];
  if (p === 'anno') return [new Date(now.getFullYear(), 0, 1), `dal 1° gennaio ${now.getFullYear()}`];
  return [new Date(now.getFullYear() - 1, now.getMonth() + 1, 1), 'ultimi 12 mesi'];
}
function viewStatistiche() {
  const d = derive();
  const [from, label] = periodRange(ui.statPeriodo);
  const fromS = localISO(from);
  const vs = d.vend.filter(v => v.data >= fromS);
  const inc = vs.reduce((s, v) => s + num(v.totale), 0);
  const cl = new Set(vs.filter(v => v.clienteId).map(v => v.clienteId));
  const nuove = [...cl].filter(id => (d.stats.get(id)?.first || '') >= fromS).length;
  const righe = vs.flatMap(v => (d.righe.get(v.id) || []).map(r => Object.assign({ _v: v }, r)));

  // incasso per mese, ultimi 12
  const now = new Date();
  const months = [];
  for (let i = 11; i >= 0; i--) { const m = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ k: `${m.getFullYear()}-${pad(m.getMonth() + 1)}`, l: MESI[m.getMonth()], y: m.getFullYear() }); }
  const byM = new Map(months.map(m => [m.k, 0]));
  d.vend.forEach(v => { const k = v.data.slice(0, 7); if (byM.has(k)) byM.set(k, byM.get(k) + num(v.totale)); });
  const maxM = Math.max(1, ...byM.values());

  const agg = (arr, key, val) => { const m = new Map(); arr.forEach(x => { const k = key(x); if (k == null) return; m.set(k, (m.get(k) || 0) + val(x)); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const perOp = agg(righe.filter(r => r.tipo !== 'consumo'), r => r.operatoreId || r._v.operatoreId, r => num(r.qta) * num(r.prezzo));
  const servTop = agg(righe.filter(r => r.tipo === 'servizio'), r => r.descrizione, r => num(r.qta));
  const servInc = new Map(agg(righe.filter(r => r.tipo === 'servizio'), r => r.descrizione, r => num(r.qta) * num(r.prezzo)));
  const prodTop = agg(righe.filter(r => r.tipo === 'prodotto'), r => r.descrizione, r => num(r.qta) * num(r.prezzo));
  const consumi = agg(righe.filter(r => r.tipo === 'consumo'), r => r.refId, r => num(r.qta));
  const metodi = agg(vs, v => v.metodo, v => num(v.totale));
  const sconti = vs.reduce((s, v) => s + num(v.sconto), 0);
  const incProd = righe.filter(r => r.tipo === 'prodotto').reduce((s, r) => s + num(r.qta) * num(r.prezzo), 0);

  const hb = (rows, fmt, cls = '') => { const mx = Math.max(1, ...rows.map(r => r[1])); return rows.length ? `<div class="hbars">${rows.map(([k, v]) => `<div class="hbar ${cls}"><div class="top"><span>${k}</span><span class="num strong">${fmt(v)}</span></div><div class="track"><div class="fill" style="width:${(v / mx * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>` : `<div class="empty">Nessun dato nel periodo.</div>`; };

  return head('Statistiche', label, `<div class="chips" role="group" aria-label="Periodo">${[['mese', 'Mese'], ['3m', '3 mesi'], ['anno', 'Anno'], ['12m', '12 mesi']].map(([k, l]) => `<button class="chip" type="button" data-act="statPeriodo" data-v="${k}" aria-pressed="${ui.statPeriodo === k}">${l}</button>`).join('')}</div>`) + `
  <div class="kpis">
    <div class="kpi accent"><div class="l">Incasso</div><div class="v">${eur(inc)}</div><div class="s">${vs.length} scontrini</div></div>
    <div class="kpi"><div class="l">Scontrino medio</div><div class="v">${eur(vs.length ? inc / vs.length : 0)}</div><div class="s">sconti dati ${eur(sconti)}</div></div>
    <div class="kpi"><div class="l">Clienti diverse</div><div class="v">${cl.size}</div><div class="s">di cui ${nuove} nuov${nuove === 1 ? 'a' : 'e'}</div></div>
    <div class="kpi"><div class="l">Rivendita prodotti</div><div class="v">${eur(incProd)}</div><div class="s">${inc ? Math.round(incProd / inc * 100) : 0}% dell'incasso</div></div>
  </div>
  <section class="panel" style="margin-bottom:16px"><header><h2>Incasso mese per mese</h2><span class="muted small">ultimi 12 mesi</span></header><div class="body">
    <div class="bars" role="img" aria-label="Incasso degli ultimi 12 mesi">${months.map((m, i) => { const v = byM.get(m.k); return `<div class="b ${i === 11 ? 'cur' : ''}"><div class="col" style="height:${(v / maxM * 100).toFixed(1)}%" title="${m.l} ${m.y}: ${eur(v)}"><span>${v ? (v >= 1000 ? fq(v / 1000) + 'k' : Math.round(v)) : ''}</span></div><div class="lab">${m.l}</div></div>`; }).join('')}</div>
  </div></section>
  <div class="grid3">

function openModal(html, wide = false, opts = {}) {
  const m = $('#modal');
  const prev = m.querySelector('.dialog');
  const sc = opts.keepScroll && prev ? prev.scrollTop : 0;
  m.innerHTML = `<div class="dialog ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false;
  if (sc) m.querySelector('.dialog').scrollTop = sc;
  if (!opts.noFocus) setTimeout(() => { const f = m.querySelector('[autofocus], input:not([type=hidden]), select, textarea, .btn.primary'); f?.focus({ preventScroll: !!sc }); }, 30);
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; formHandler = null; }
let formHandler = null;

/* fields: [{k, l, t, o (options), full, hint, req, step, min, ph}] */
function form({ title, fields, values = {}, onSave, onDelete, delLabel = 'Elimina', saveLabel = 'Salva', intro = '' }) {
  const f = fields.map(x => {
    const id = 'f_' + x.k; const v = values[x.k] ?? x.def ?? '';
    const cls = `f ${x.full ? 'full' : ''}`;
    const hint = x.hint ? `<span class="hint">${x.hint}</span>` : '';
    if (x.t === 'check') return `<label class="check ${x.full !== false ? 'full' : ''}" for="${id}"><input type="checkbox" id="${id}" name="${x.k}" ${bool(v) ? 'checked' : ''}><span>${x.l}${x.hint ? `<br>${hint}` : ''}</span></label>`;
    if (x.t === 'select') return `<label class="${cls}" for="${id}">${x.l}<select id="${id}" name="${x.k}">${x.o.map(([ov, ol]) => `<option value="${h(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${h(ol)}</option>`).join('')}</select>${hint}</label>`;
    if (x.t === 'dmy') return `<label class="${cls}" for="${id}">${x.l}<input id="${id}" name="${x.k}" type="text" inputmode="numeric" placeholder="gg/mm/aaaa" maxlength="10" autocomplete="off" data-dmy="1" value="${h(isoToDmy(v))}">${hint}</label>`;
    if (x.t === 'area') return `<label class="${cls}" for="${id}">${x.l}<textarea id="${id}" name="${x.k}" placeholder="${h(x.ph || '')}">${h(v)}</textarea>${hint}</label>`;
    return `<label class="${cls}" for="${id}">${x.l}<input id="${id}" name="${x.k}" type="${x.t || 'text'}" value="${h(v)}" placeholder="${h(x.ph || '')}" ${x.req ? 'required' : ''} ${x.step ? `step="${x.step}"` : ''} ${x.min != null ? `min="${x.min}"` : ''} ${x.t === 'number' ? 'inputmode="decimal"' : ''} ${x.af ? 'autofocus' : ''}>${hint}</label>`;
  }).join('');
  openModal(`<h2>${title}</h2>${intro}<form class="form" data-form="modal" novalidate>${f}
    <div class="actions full">${onDelete ? `<button class="btn danger left" type="button" data-act="formDelete">${delLabel}</button>` : ''}<button class="btn" type="button" data-act="close">Annulla</button><button class="btn primary" type="submit">${saveLabel}</button></div></form>`, fields.length > 6);
  formHandler = { onSave, onDelete, fields };
}
/* date scritte come gg/mm/aaaa, salvate come aaaa-mm-gg */
const isoToDmy = v => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v || '')); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
function dmyToIso(v) {
  v = String(v || '').trim(); if (!v) return '';
  const m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(v); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3]; const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d || y < 1900 || dt > new Date()) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.dmy) return;
  const dg = t.value.replace(/\D/g, '').slice(0, 8);
  const nv = dg.length > 4 ? `${dg.slice(0, 2)}/${dg.slice(2, 4)}/${dg.slice(4)}` : dg.length > 2 ? `${dg.slice(0, 2)}/${dg.slice(2)}` : dg;
  if (nv !== t.value) t.value = nv;
});
function readForm(el, fields) {
  const o = {};
  for (const x of fields) {
    const i = el.elements[x.k]; if (!i) continue;
    o[x.k] = x.t === 'check' ? i.checked : x.t === 'number' ? num(i.value) : x.t === 'dmy' ? dmyToIso(i.value) : i.value.trim();
  }
  return o;
}
function confirmBox(text, okLabel, fn, danger = true) {

  formHandler = { onConfirm: fn };
}

}

/* ---------- Agenda ---------- */
const SLOT = 15, ROW = 22;
const GIORNI = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const STATI = { prenotato: ['Prenotata', ''], arrivata: ['Arrivata', 'accent'], fatto: ['Incassata', 'ok'], nonvenuta: ['Non venuta', 'danger'], annullato: ['Annullato', ''] };
const hm2m = s => { const [a, b] = String(s || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
const m2hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const addDays = (ds, n) => { const d = parseD(ds); d.setDate(d.getDate() + n); return localISO(d).slice(0, 10); };
const isOpenDay = ds => (cfg.giorni || []).includes(parseD(ds).getDay());
const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
const fday = ds => parseD(ds).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
const durTxt = m => (m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) : ''}` : `${m} min`);
let agendaDay = todayStr();
let agendaVista = store.get('specchio.vista', 'settimana');

function apptServizi(a) { const by = derive().by.Servizi; return String(a.servizi || '').split(',').filter(Boolean).map(id => by.get(id)).filter(Boolean); }
const apptPrezzo = a => apptServizi(a).reduce((x, sv) => x + num(sv.prezzo), 0);
const apptEnd = a => hm2m(a.ora) + num(a.durata);
/** Posa: intervallo [inizio, fine] in minuti dall'inizio dell'appuntamento, se un servizio ce l'ha. */
function apptPosa(a) {
  if (!cfg.usaPosa) return null; // per ora la posa non libera chi lavora: l'appuntamento occupa tutta la sua durata
  let t = 0;
  for (const sv of apptServizi(a)) {
    const d = num(sv.durata), p = num(sv.posa);
    if (p > 0 && p < d) { const lead = Math.min(20, d - p); return [t + lead, Math.min(t + lead + p, num(a.durata))]; }
    t += d;
  }
  return null;
}
function apptBusy(a) {
  const st = hm2m(a.ora), en = apptEnd(a), p = apptPosa(a);
  if (!p) return [[st, en]];
  return [[st, st + p[0]], [st + p[1], en]].filter(([x, y]) => y > x);
}
const inAgenda = a => a.stato !== 'annullato';
function apptsOf(ds) { return data.Appuntamenti.filter(a => a.data === ds && inAgenda(a)).sort((a, b) => (a.ora < b.ora ? -1 : a.ora > b.ora ? 1 : 0)); }
function conflicts(a) {
  if (!a.operatoreId) return [];
  const mine = apptBusy(a);
  return data.Appuntamenti.filter(b => b.id !== a.id && b.data === a.data && b.operatoreId === a.operatoreId && inAgenda(b) && b.stato !== 'nonvenuta')
    .filter(b => apptBusy(b).some(([x, y]) => mine.some(([p, q]) => x < q && p < y)));
}
function nextOpenDay(ds) { for (let i = 1; i <= 14; i++) { const d = addDays(ds, i); if (isOpenDay(d)) return d; } return addDays(ds, 1); }
function giornoTxt(ds) { const t = todayStr(); if (ds === t) return 'oggi'; if (ds === addDays(t, 1)) return 'domani'; return fday(ds); }
function sentSet() { return new Set(store.get('specchio.sent', [])); }
function markSent(id) { const s = sentSet(); s.add(id); store.set('specchio.sent', [...s].slice(-400)); setTimeout(() => { if (!isBusy()) render(); }, 400); }

/* Da confermare a fine giornata: solo appuntamenti prenotati, senza incasso, del giorno (dopo l'ora di chiusura) o dei giorni passati */
function daChiudere() {
  const t = todayStr(), now = localISO().slice(11, 16);
  return data.Appuntamenti.filter(a => !a.venditaId && (a.stato === 'prenotato' || a.stato === 'arrivata') && (a.data < t || (a.data === t && now >= cfg.oraChiusura && a.ora <= now)))
    .sort((a, b) => ((a.data + a.ora) < (b.data + b.ora) ? -1 : 1));
}
function chiusuraBanner() {
  const l = daChiudere();
  if (!l.length) return '';
  const vecchi = l.filter(a => a.data < todayStr()).length;
  return `<div class="banner close" role="note"><div><b>Chiusura giornata.</b> ${l.length} appuntament${l.length === 1 ? 'o' : 'i'} da confermare${vecchi ? `, di cui ${vecchi} di giorni precedenti` : ''}: per ognuno ti chiedo se la cliente è venuta e quanto ha pagato.</div><button class="btn sm primary" type="button" data-act="chiusuraStart">Inizia</button></div>`;
}

function apptItem(a, showOp = true) {
  const c = derive().by.Clienti.get(a.clienteId);
  const [sl, sc] = STATI[a.stato] || STATI.prenotato;
  const sv = apptServizi(a).map(x => x.nome).join(', ') || 'nessun servizio';

    <div class="main"><div class="t">${h(fullName(c))}</div><div class="d">${showOp ? `<span class="opdot" style="background:${h(opColor(a.operatoreId))}"></span> ${h(a.operatoreId ? opName(a.operatoreId) : 'da assegnare')} · ` : ''}${h(sv)}</div></div>
    <div class="end"><span class="pill ${sc}">${sl}</span></div></button></li>`;
}
function clienteAppts(c) {
  const t = todayStr();
  const all = data.Appuntamenti.filter(a => a.clienteId === c.id);
  const next = all.filter(a => a.data >= t && (a.stato === 'prenotato' || a.stato === 'arrivata')).sort((a, b) => ((a.data + a.ora) < (b.data + b.ora) ? -1 : 1))[0];
  const nv = all.filter(a => a.stato === 'nonvenuta').length;
  if (!next && !nv) return '';
  return `<div class="row" style="margin:-8px 0 16px">${next ? `<button class="pill accent" type="button" data-act="appt" data-id="${next.id}" style="border:0;cursor:pointer;padding:6px 12px">${icon('agenda', 'style="width:14px;height:14px"')} Prossimo appuntamento: ${h(giornoTxt(next.data))} alle ${h(next.ora)}</button>` : ''}${nv ? `<span class="pill ${nv > 1 ? 'danger' : 'warn'}" style="padding:6px 12px">Non si è presentata ${nv} volt${nv === 1 ? 'a' : 'e'}</span>` : ''}</div>`;
}

function viewAgenda() { return agendaVista === 'giorno' ? viewDay() : viewWeek(); }
function viewDay() {
  const ds = agendaDay;
  const list = apptsOf(ds);
  const ops = operatori();
  const cols = ops.map(o => ({ id: o.id, nome: o.nome, colore: o.colore }));
  if (list.some(a => !ops.some(o => o.id === a.operatoreId))) cols.push({ id: '', nome: 'Da assegnare', colore: 'var(--muted)' });
  if (!cols.length) cols.push({ id: '', nome: 'Appuntamenti', colore: 'var(--muted)' });
  const open = hm2m(cfg.apertura), close = hm2m(cfg.chiusura);
  let from = Math.min(open, ...list.map(a => hm2m(a.ora)));
  let to = Math.max(close, ...list.map(apptEnd));
  from = Math.floor(from / 30) * 30; to = Math.ceil(to / 30) * 30;
  const H = (to - from) / SLOT * ROW;
  const isToday = ds === todayStr();
  const nowM = hm2m(localISO().slice(11, 16));
  const closed = !isOpenDay(ds);

  // striscia della settimana
  const d0 = parseD(ds); const monday = addDays(ds, -((d0.getDay() + 6) % 7));
  const week = [...Array(7)].map((_, i) => addDays(monday, i));
  const strip = `<div class="weekstrip" role="group" aria-label="Settimana">${week.map(w => { const dd = parseD(w); const n = apptsOf(w).length; return `<button type="button" class="wd ${isOpenDay(w) ? '' : 'closed'} ${w === todayStr() ? 'today' : ''}" data-act="agendaDay" data-v="${w}" aria-pressed="${w === ds}"><span class="g">${GIORNI[dd.getDay()]}</span><span class="n">${dd.getDate()}</span><span class="c">${n ? `${n} app.` : isOpenDay(w) ? '—' : 'chiuso'}</span></button>`; }).join('')}</div>`;

  const hours = []; for (let m = Math.ceil(from / 60) * 60; m <= to; m += 60) hours.push(m);
  const colHtml = cols.map(c => {
    const items = list.filter(a => (a.operatoreId || '') === c.id || (c.id === '' && !ops.some(o => o.id === a.operatoreId))).map(a => ({ a, s: hm2m(a.ora), e: apptEnd(a) }));
    layoutLanes(items);
    const off = offZones(from, to);
    return `<div class="dg-c" data-act="slot" data-op="${c.id}" data-from="${from}" style="height:${H}px;background-position-y:${-(from % 60) / SLOT * ROW}px" title="Tocca uno spazio libero per prenotare">
      ${off.map(([x, y]) => `<div class="dg-off" style="top:${(x - from) / SLOT * ROW}px;height:${(y - x) / SLOT * ROW}px"></div>`).join('')}
      ${items.map(it => apptBlock(it, from)).join('')}
      ${isToday && nowM >= from && nowM <= to ? `<div class="dg-now" style="top:${(nowM - from) / SLOT * ROW}px"></div>` : ''}
    </div>`;
  }).join('');

  return head(cap(fday(ds)), closed ? 'Agenda · giorno di chiusura' : 'Agenda', `${vistaToggle()}
      <div class="row" style="gap:6px"><button class="btn icon" type="button" aria-label="Giorno prima" data-act="agendaShift" data-v="-1">${icon('left')}</button>
      <button class="btn" type="button" data-act="agendaOggi" ${isToday ? 'disabled' : ''}>Oggi</button>

/* Mette affiancati gli appuntamenti che si sovrappongono nella stessa colonna */
function layoutLanes(items) {

function abituale(clienteId) {

    const r = (d.righe.get(v.id) || []).find(x => x.tipo === 'servizio');

/* minuti liberi di una persona in un giorno, dentro l'orario di apertura (la posa conta come libera) */
/* fasce in cui si lavora: apertura → pausa, pausa → chiusura */
function workSegments() {
  const open = hm2m(cfg.apertura), close = hm2m(cfg.chiusura);
  const pd = cfg.pausaDa ? hm2m(cfg.pausaDa) : null, pa = cfg.pausaA ? hm2m(cfg.pausaA) : null;
  if (pd == null || pa == null || pa <= pd || pd <= open || pa >= close) return [[open, close]];
  return [[open, pd], [pa, close]];
}
const workMinutes = () => workSegments().reduce((x, [a, b]) => x + b - a, 0);
function inPausa(intervals) {
  const segs = workSegments(); if (segs.length < 2) return false;
  const [pd, pa] = [segs[0][1], segs[1][0]];
  return intervals.some(([x, y]) => x < pa && pd < y);
}
function freeMinutes(ds, opId) {
  const busy = data.Appuntamenti.filter(a => a.data === ds && a.operatoreId === opId && inAgenda(a) && a.stato !== 'nonvenuta').flatMap(apptBusy).sort((a, b) => a[0] - b[0]);
  let free = 0;
  for (const [s0, e0] of workSegments()) {
    let used = 0, cur = s0;
    for (const [x0, y0] of busy) { const x = Math.max(x0, cur), y = Math.min(y0, e0); if (y > x) { used += y - x; cur = y; } }
    free += e0 - s0 - used;
  }
  return Math.max(0, free);
}
/* zone tratteggiate: prima dell'apertura, pausa, dopo la chiusura */
function offZones(from, to) {
  const segs = workSegments(); const out = [];
  if (segs[0][0] > from) out.push([from, segs[0][0]]);
  for (let i = 1; i < segs.length; i++) out.push([segs[i - 1][1], segs[i][0]]);
  if (segs[segs.length - 1][1] < to) out.push([segs[segs.length - 1][1], to]);
  return out;
}
function viewWeek() {

  const rangeTxt = `${parseD(monday).getDate()}${parseD(monday).getMonth() !== parseD(sun).getMonth() ? ' ' + MESI[parseD(monday).getMonth()] : ''} – ${parseD(sun).getDate()} ${MESI[parseD(sun).getMonth()]} ${parseD(sun).getFullYear()}`;
  const hours = []; for (let m = Math.ceil(from / 60) * 60; m <= to; m += 60) hours.push(m);
  const weekFree = days.filter(isOpenDay).reduce((x, d) => x + ops.reduce((y, o) => y + (d < t ? 0 : freeMinutes(d, o.id)), 0), 0);
  const nav = `<div class="weeknav">

(function slotGhost() {
  let ghost = null;
  document.addEventListener('mousemove', e => {
    if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
    const col = e.target.closest?.('[data-act=slot], [data-act=wslot]');
    if (!col || e.target.closest('.appt, .wk-b')) { if (ghost) ghost.hidden = true; return; }
    const row = col.dataset.act === 'wslot' ? WROW : ROW;
    const r = col.getBoundingClientRect();
    const k = Math.floor((e.clientY - r.top) / row);
    const m = +col.dataset.from + k * SLOT;
    if (!ghost || ghost.parentElement !== col) { ghost?.remove(); ghost = document.createElement('div'); ghost.className = 'slot-ghost'; col.appendChild(ghost); }
    ghost.hidden = false;
    ghost.style.top = k * row + 'px'; ghost.style.height = row + 'px'; ghost.style.lineHeight = (row - 3) + 'px';
    ghost.textContent = '+ ' + m2hm(m);
  });
})();

  // giacenza iniziale calcolata in modo che oggi risulti quella voluta
  prods.forEach(p => {
    const used = d.Movimenti.filter(m => m.prodottoId === p.id).reduce((s, m) => s + m.qta, 0);
    d.Movimenti.unshift({ id: uid(), data: iniDate, prodottoId: p.id, qta: p._ini - used, causale: 'iniziale', venditaId: '', note: '' });
  });
  for (const k in d) d[k] = d[k].map(r => normRow(k, r));
  data = d; ver++;
  store.set(K.data, data);
  meta.demo = true; meta.demoVer = 8; store.set(K.meta, meta);
  cart = newCart();
}

/* ---------- Avvio ---------- */
(function boot() {
  const saved = store.get(K.data, null);
  if (saved && typeof saved === 'object') { data = emptyData(); for (const k in SCHEMA) data[k] = (saved[k] || []).map(r => normRow(k, r)); ver++; }
  if (isDemo() && (!saved || meta.demoVer !== 8 || (!meta.demo && !data.Vendite.length && !data.Clienti.length))) seedDemo();
  if (!isDemo() && !cfg.pin) needLogin = true;
  cart = newCart();
  render();
  if (!isDemo()) sync();
  if (!store.get('specchio.tourHide', false) && !needLogin) setTimeout(tourStart, 700);
  setInterval(() => { if (document.visibilityState === 'visible' && !isBusy()) sync(); }, 120000);
  setInterval(() => { if (document.visibilityState !== 'visible' || isBusy()) return; if (route.v === 'agenda') { if (!isDemo()) sync(); render(); } else if (route.v === 'oggi') render(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  window.addEventListener('online', () => sync());
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) {}
})();
</script>
